name: PR

on:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build --configuration Release
      - name: Unit tests
        run: dotnet test --configuration Release --no-build
      - name: Script tests (no secrets)
        run: |
          bash tests/scripts/test-launch-local.sh
          bash tests/scripts/test-deploy-config.sh
          bash tests/scripts/test-monitoring.sh
      - name: Compile infrastructure (no Azure credentials)
        run: az bicep build --file infra/main.bicep --outfile "$RUNNER_TEMP/main.json"
